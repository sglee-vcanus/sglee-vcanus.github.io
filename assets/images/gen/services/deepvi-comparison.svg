<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="510" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">경쟁사 대비 강점</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#475569">범용 AutoML / Vision 전문 툴 대비 DeepVi의 핵심 차별점</text>

  <!-- Header row -->
  <rect x="40" y="90" width="380" height="46" rx="6" fill="#f1f5f9"/>
  <text x="60" y="118" font-size="13" font-weight="700" fill="#0f172a">비교 항목</text>

  <rect x="425" y="90" width="195" height="46" rx="6" fill="#f1f5f9"/>
  <text x="522" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">범용 AutoML</text>
  <text x="522" y="128" text-anchor="middle" font-size="10" fill="#94a3b8">Vertex AI · SageMaker</text>

  <rect x="625" y="90" width="195" height="46" rx="6" fill="#f1f5f9"/>
  <text x="722" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Vision 전문 툴</text>
  <text x="722" y="128" text-anchor="middle" font-size="10" fill="#94a3b8">Roboflow · Label Studio</text>

  <rect x="825" y="90" width="235" height="46" rx="6" fill="#1e40af"/>
  <text x="942" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">DeepVi ★</text>
  <text x="942" y="128" text-anchor="middle" font-size="10" fill="#bfdbfe">VCANUS</text>

  <!-- Helper: render rows -->
  <!-- Row template: y=140, 175, 210, 245, 280, 315, 350, 385, 420, 455 -->

  <!-- Row 1: 코딩 필요성 -->
  <text x="60" y="159" font-size="12" font-weight="600" fill="#0f172a">코딩 필요성</text>
  <text x="522" y="159" text-anchor="middle" font-size="13" fill="#d97706">⚠️ 부분 필요</text>
  <text x="722" y="159" text-anchor="middle" font-size="13" fill="#16a34a">✅ 불필요</text>
  <rect x="825" y="143" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="161" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ 완전 No-Code</text>

  <!-- Row 2: 라벨링 3종 통합 -->
  <text x="60" y="194" font-size="12" font-weight="600" fill="#0f172a">라벨링 3종 통합</text>
  <text x="60" y="208" font-size="9" fill="#64748b">Cls · Det · Seg</text>
  <text x="522" y="194" text-anchor="middle" font-size="13" fill="#d97706">⚠️ 플랫폼별 상이</text>
  <text x="722" y="194" text-anchor="middle" font-size="13" fill="#16a34a">✅ 라벨링 강점</text>
  <rect x="825" y="178" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ 단일 환경 내장</text>

  <!-- Row 3: 실시간 카메라 추론 -->
  <text x="60" y="229" font-size="12" font-weight="600" fill="#0f172a">실시간 카메라 추론</text>
  <text x="522" y="229" text-anchor="middle" font-size="13" fill="#dc2626">❌ 별도 개발</text>
  <text x="722" y="229" text-anchor="middle" font-size="13" fill="#dc2626">❌ 미지원</text>
  <rect x="825" y="213" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="231" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ 즉시 연동</text>

  <!-- Row 4: 학습 속도 -->
  <text x="60" y="264" font-size="12" font-weight="600" fill="#0f172a">학습 속도</text>
  <text x="522" y="264" text-anchor="middle" font-size="13" fill="#16a34a">✅ 빠름</text>
  <text x="722" y="264" text-anchor="middle" font-size="13" fill="#d97706">⚠️ 보통</text>
  <rect x="825" y="248" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ 수일 내 완결</text>

  <!-- Row 5: 자동 재학습 루프 -->
  <text x="60" y="299" font-size="12" font-weight="600" fill="#0f172a">자동 재학습 루프</text>
  <text x="60" y="313" font-size="9" fill="#64748b">오탐 → Retrain</text>
  <text x="522" y="299" text-anchor="middle" font-size="13" fill="#dc2626">❌ 미지원</text>
  <text x="722" y="299" text-anchor="middle" font-size="13" fill="#d97706">⚠️ 분리된 워크플로우</text>
  <rect x="825" y="283" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="301" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ Inference Review</text>

  <!-- Row 6: 클라우드 의존성 -->
  <text x="60" y="334" font-size="12" font-weight="600" fill="#0f172a">클라우드 의존성</text>
  <text x="522" y="334" text-anchor="middle" font-size="13" fill="#dc2626">❌ 완전 의존</text>
  <text x="722" y="334" text-anchor="middle" font-size="13" fill="#d97706">⚠️ 부분 의존</text>
  <rect x="825" y="318" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ On-Premise 가능</text>

  <!-- Row 7: 데이터 보안 -->
  <text x="60" y="369" font-size="12" font-weight="600" fill="#0f172a">데이터 보안</text>
  <text x="522" y="369" text-anchor="middle" font-size="13" fill="#dc2626">❌ 외부 전송</text>
  <text x="722" y="369" text-anchor="middle" font-size="13" fill="#dc2626">❌ 외부 전송</text>
  <rect x="825" y="353" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="371" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ 내부 서버 처리</text>

  <!-- Row 8: 도메인 특화 -->
  <text x="60" y="404" font-size="12" font-weight="600" fill="#0f172a">도메인 특화 / 커스터마이징</text>
  <text x="522" y="404" text-anchor="middle" font-size="13" fill="#d97706">⚠️ 제한적</text>
  <text x="722" y="404" text-anchor="middle" font-size="13" fill="#d97706">⚠️ 제한적</text>
  <rect x="825" y="388" width="235" height="28" rx="4" fill="#dbeafe"/>
  <text x="942" y="406" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">✅ 산업별 완전 맞춤</text>

  <!-- Horizontal divider lines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="170" x2="1060" y2="170"/>
    <line x1="40" y1="205" x2="1060" y2="205"/>
    <line x1="40" y1="240" x2="1060" y2="240"/>
    <line x1="40" y1="275" x2="1060" y2="275"/>
    <line x1="40" y1="310" x2="1060" y2="310"/>
    <line x1="40" y1="345" x2="1060" y2="345"/>
    <line x1="40" y1="380" x2="1060" y2="380"/>
  </g>

  <!-- Bottom summary -->
  <rect x="40" y="440" width="1020" height="55" rx="10" fill="#0f172a"/>
  <text x="550" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">DeepVi의 결정적 차별점 — End-to-End No-Code · 실시간 카메라 추론 · 오탐 자동 재학습 루프</text>
  <text x="550" y="485" text-anchor="middle" font-size="12" fill="#94a3b8">현장 담당자가 직접 운영하는 AI 비전 플랫폼 · 데이터 외부 전송 없는 내부 완결 처리</text>
</svg>

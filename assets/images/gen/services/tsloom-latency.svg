<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="380" fill="#fef2f2"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">실시간 데이터 처리</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#7f1d1d">산업 환경에 적합한 저지연·고처리량 처리 · 다중 스트림 통합 · 데이터 신뢰성</text>

  <!-- Three pillar cards -->
  <g>
    <rect x="40" y="100" width="330" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="205" y="135" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">처리 성능</text>
    <text x="205" y="170" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">저지연 · 고처리량</text>
    <text x="205" y="195" text-anchor="middle" font-size="11" fill="#7f1d1d">실시간 데이터 처리 안정성</text>
    <text x="205" y="212" text-anchor="middle" font-size="11" fill="#7f1d1d">다중 채널 동시 처리</text>

    <rect x="385" y="100" width="330" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="550" y="135" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">다중 스트림 통합</text>
    <text x="550" y="170" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">윈도우 · 트리거 · 라우팅</text>
    <text x="550" y="195" text-anchor="middle" font-size="11" fill="#7f1d1d">인라인 변환 · 집계</text>
    <text x="550" y="212" text-anchor="middle" font-size="11" fill="#7f1d1d">계층적 다중 소스 관리</text>

    <rect x="730" y="100" width="330" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="895" y="135" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">데이터 신뢰성</text>
    <text x="895" y="170" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">시간 동기화 · 무손실</text>
    <text x="895" y="195" text-anchor="middle" font-size="11" fill="#7f1d1d">결측·이상값 실시간 보정</text>
    <text x="895" y="212" text-anchor="middle" font-size="11" fill="#7f1d1d">메시지 순서 보장</text>
  </g>

  <!-- Bottom feature cards -->
  <g>
    <rect x="40" y="245" width="330" height="110" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="55" y="270" font-size="13" font-weight="700" fill="#991b1b">처리 성능 특징</text>
    <text x="55" y="293" font-size="11" fill="#7f1d1d">• 산업 현장에 적합한 안정적 처리</text>
    <text x="55" y="312" font-size="11" fill="#7f1d1d">• 인라인 필터링 · 집계 · 변환</text>
    <text x="55" y="331" font-size="11" fill="#7f1d1d">• 이벤트 기반 트리거</text>

    <rect x="385" y="245" width="330" height="110" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="400" y="270" font-size="13" font-weight="700" fill="#991b1b">다중 스트림 처리</text>
    <text x="400" y="293" font-size="11" fill="#7f1d1d">• 슬라이딩·텀블링 윈도우 통계</text>
    <text x="400" y="312" font-size="11" fill="#7f1d1d">• 다중 소스 통합 관리</text>
    <text x="400" y="331" font-size="11" fill="#7f1d1d">• 대용량 메시지의 효율적 처리</text>

    <rect x="730" y="245" width="330" height="110" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="745" y="270" font-size="13" font-weight="700" fill="#991b1b">시간 동기화 · 신뢰성</text>
    <text x="745" y="293" font-size="11" fill="#7f1d1d">• 다중 스트림 시간축 정렬</text>
    <text x="745" y="312" font-size="11" fill="#7f1d1d">• 결측·이상값 실시간 감지·보정</text>
    <text x="745" y="331" font-size="11" fill="#7f1d1d">• 메시지 순서 보장 · 무손실 수집</text>
  </g>
</svg>

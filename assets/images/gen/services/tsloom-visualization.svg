<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="360" fill="#f0fdf4"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">고성능 시각화 및 분석</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#15803d">대용량 데이터 실시간 가시화 · 인터랙티브 탐색 및 알람</text>

  <!-- mock dashboard -->
  <rect x="40" y="90" width="640" height="240" rx="10" fill="#0f172a"/>
  <rect x="55" y="105" width="200" height="105" rx="6" fill="#064e3b"/>
  <polyline points="65,190 90,170 115,180 140,150 165,165 190,140 215,155 240,130" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="65" y="125" font-size="10" fill="#86efac">실시간 시계열</text>

  <rect x="265" y="105" width="200" height="105" rx="6" fill="#1e3a8a"/>
  <g>
    <rect x="280" y="180" width="15" height="20" fill="#60a5fa"/>
    <rect x="300" y="160" width="15" height="40" fill="#60a5fa"/>
    <rect x="320" y="145" width="15" height="55" fill="#60a5fa"/>
    <rect x="340" y="170" width="15" height="30" fill="#60a5fa"/>
    <rect x="360" y="155" width="15" height="45" fill="#60a5fa"/>
    <rect x="380" y="140" width="15" height="60" fill="#60a5fa"/>
    <rect x="400" y="165" width="15" height="35" fill="#60a5fa"/>
    <rect x="420" y="150" width="15" height="50" fill="#60a5fa"/>
    <rect x="440" y="170" width="15" height="30" fill="#60a5fa"/>
  </g>
  <text x="275" y="125" font-size="10" fill="#bfdbfe">스펙트럼 · 히스토그램</text>

  <rect x="475" y="105" width="190" height="105" rx="6" fill="#581c87"/>
  <g>
    <rect x="490" y="125" width="22" height="22" fill="#a855f7"/>
    <rect x="515" y="125" width="22" height="22" fill="#c084fc"/>
    <rect x="540" y="125" width="22" height="22" fill="#9333ea"/>
    <rect x="565" y="125" width="22" height="22" fill="#7e22ce"/>
    <rect x="590" y="125" width="22" height="22" fill="#a855f7"/>
    <rect x="615" y="125" width="22" height="22" fill="#c084fc"/>
    <rect x="490" y="150" width="22" height="22" fill="#7e22ce"/>
    <rect x="515" y="150" width="22" height="22" fill="#9333ea"/>
    <rect x="540" y="150" width="22" height="22" fill="#a855f7"/>
    <rect x="565" y="150" width="22" height="22" fill="#c084fc"/>
    <rect x="590" y="150" width="22" height="22" fill="#9333ea"/>
    <rect x="615" y="150" width="22" height="22" fill="#7e22ce"/>
    <rect x="490" y="175" width="22" height="22" fill="#c084fc"/>
    <rect x="515" y="175" width="22" height="22" fill="#9333ea"/>
    <rect x="540" y="175" width="22" height="22" fill="#7e22ce"/>
    <rect x="565" y="175" width="22" height="22" fill="#a855f7"/>
    <rect x="590" y="175" width="22" height="22" fill="#c084fc"/>
    <rect x="615" y="175" width="22" height="22" fill="#9333ea"/>
  </g>
  <text x="485" y="120" font-size="10" fill="#e9d5ff">히트맵</text>

  <rect x="55" y="220" width="610" height="100" rx="6" fill="#1f2937"/>
  <text x="70" y="240" font-size="11" fill="#fca5a5" font-weight="700">[WARN] 임계값 초과 — 실시간 알람</text>
  <text x="70" y="260" font-size="11" fill="#fca5a5" font-weight="700">[ERR]  이상 신호 감지</text>
  <text x="70" y="280" font-size="11" fill="#86efac">[INFO] 모델 배포 완료</text>
  <text x="70" y="300" font-size="11" fill="#cbd5e1">CSV · Excel 내보내기 · 데이터 이력 조회</text>

  <!-- features panel -->
  <rect x="700" y="90" width="360" height="240" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="715" y="115" font-size="14" font-weight="700" fill="#15803d">시각화 엔진</text>
  <text x="715" y="135" font-size="11" fill="#166534">• 가속 기반 고성능 차트 렌더링</text>
  <text x="715" y="153" font-size="11" fill="#166534">• 대용량 시계열의 실시간 표현</text>
  <text x="715" y="171" font-size="11" fill="#166534">• 다양한 과학적 차트 (시계열·스펙트럼·히트맵)</text>
  <text x="715" y="189" font-size="11" fill="#166534">• 설비 상태 시각화</text>
  <text x="715" y="207" font-size="11" fill="#166534">• 영상 스트림 통합</text>

  <text x="715" y="235" font-size="14" font-weight="700" fill="#15803d">대시보드 · 인터랙티브 분석</text>
  <text x="715" y="255" font-size="11" fill="#166534">• 사용자 정의 위젯 · 레이아웃 커스터마이징</text>
  <text x="715" y="273" font-size="11" fill="#166534">• 임계값 알람 · 이벤트 로그</text>
  <text x="715" y="291" font-size="11" fill="#166534">• 줌 · 패닝 · 구간 선택</text>
  <text x="715" y="309" font-size="11" fill="#166534">• 데이터 이력 조회 · 외부 포맷 내보내기</text>
</svg>

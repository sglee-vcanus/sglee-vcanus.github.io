<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1100" height="400" fill="#faf5ff"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#6b21a8">Collaborative Edge AI &amp; MLOps</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#7e22ce">협업형 엣지 기반 AI 모델 개발 및 운영 — Tiered Inference / Auto-MLOps</text>

  <!-- Tier diagram -->
  <rect x="40" y="90" width="700" height="280" rx="10" fill="#ffffff" stroke="#a855f7"/>
  <text x="55" y="115" font-size="13" font-weight="700" fill="#6b21a8">계층적 추론 (Tiered Inference)</text>

  <!-- Edge node -->
  <rect x="60" y="135" width="180" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Near Edge</text>
  <text x="150" y="185" text-anchor="middle" font-size="11" fill="#5b21b6">저지연 1차 진단</text>
  <text x="150" y="205" text-anchor="middle" font-size="11" fill="#5b21b6">저복잡도 모델</text>
  <text x="150" y="225" text-anchor="middle" font-size="11" fill="#5b21b6">오프라인 추론</text>

  <!-- arrows -->
  <line x1="245" y1="185" x2="295" y2="185" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="178" text-anchor="middle" font-size="10" fill="#7c3aed">routing</text>

  <!-- Server -->
  <rect x="300" y="135" width="180" height="100" rx="10" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <text x="390" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">On-Premise / Cloud</text>
  <text x="390" y="185" text-anchor="middle" font-size="11" fill="#e9d5ff">심층 분석 · 고정확도</text>
  <text x="390" y="205" text-anchor="middle" font-size="11" fill="#e9d5ff">중앙 집중 추론</text>
  <text x="390" y="225" text-anchor="middle" font-size="11" fill="#e9d5ff">복합 모델</text>

  <!-- Multimodal pills -->
  <text x="55" y="265" font-size="13" font-weight="700" fill="#6b21a8">멀티모달 입력</text>
  <g font-size="11" font-weight="600">
    <rect x="60" y="280" width="80" height="28" rx="14" fill="#a855f7"/><text x="100" y="298" text-anchor="middle" fill="#ffffff">Raw</text>
    <rect x="150" y="280" width="80" height="28" rx="14" fill="#a855f7"/><text x="190" y="298" text-anchor="middle" fill="#ffffff">Text</text>
    <rect x="240" y="280" width="100" height="28" rx="14" fill="#a855f7"/><text x="290" y="298" text-anchor="middle" fill="#ffffff">DataFrame</text>
    <rect x="350" y="280" width="80" height="28" rx="14" fill="#a855f7"/><text x="390" y="298" text-anchor="middle" fill="#ffffff">Image</text>
  </g>

  <!-- Languages -->
  <text x="55" y="335" font-size="13" font-weight="700" fill="#6b21a8">개발 환경</text>
  <g font-size="11" font-weight="600">
    <rect x="60" y="350" width="80" height="28" rx="14" fill="#1e40af"/><text x="100" y="368" text-anchor="middle" fill="#ffffff">Python</text>
    <rect x="150" y="350" width="80" height="28" rx="14" fill="#1e40af"/><text x="190" y="368" text-anchor="middle" fill="#ffffff">C++</text>
    <rect x="240" y="350" width="80" height="28" rx="14" fill="#1e40af"/><text x="280" y="368" text-anchor="middle" fill="#ffffff">C#</text>
    <rect x="330" y="350" width="380" height="28" rx="14" fill="#0f766e"/><text x="520" y="368" text-anchor="middle" fill="#ffffff">Data IO · Transform · Feature Extraction · Analytics · Trigger</text>
  </g>

  <!-- MLOps lifecycle on right -->
  <rect x="760" y="90" width="300" height="280" rx="10" fill="#0f172a"/>
  <text x="910" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MLOps 자동화 파이프라인</text>

  <g font-size="12" font-weight="600">
    <circle cx="800" cy="155" r="22" fill="#a855f7"/><text x="800" y="160" text-anchor="middle" fill="#ffffff">Train</text>
    <line x1="824" y1="155" x2="858" y2="155" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="880" cy="155" r="22" fill="#a855f7"/><text x="880" y="160" text-anchor="middle" fill="#ffffff">Reg</text>
    <line x1="904" y1="155" x2="938" y2="155" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="960" cy="155" r="22" fill="#a855f7"/><text x="960" y="160" text-anchor="middle" fill="#ffffff">Deploy</text>
    <line x1="984" y1="155" x2="1018" y2="155" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="1040" cy="155" r="22" fill="#a855f7"/><text x="1040" y="160" text-anchor="middle" fill="#ffffff">Mon</text>
  </g>

  <!-- alerts -->
  <rect x="775" y="195" width="270" height="30" rx="6" fill="#1e293b"/>
  <text x="785" y="215" font-size="11" fill="#86efac">14:32  v2.1 배포 완료</text>
  <rect x="775" y="230" width="270" height="30" rx="6" fill="#1e293b"/>
  <text x="785" y="250" font-size="11" fill="#fde68a">13:11  v2.0 성능 저하 감지</text>
  <rect x="775" y="265" width="270" height="30" rx="6" fill="#1e293b"/>
  <text x="785" y="285" font-size="11" fill="#fca5a5">12:58  v1.9 롤백 실행</text>

  <text x="775" y="320" font-size="11" fill="#cbd5e1">• 모델 카탈로그 (Registry) · 버전 관리</text>
  <text x="775" y="338" font-size="11" fill="#cbd5e1">• 자동 모니터링 (정확도 · 드리프트)</text>
  <text x="775" y="356" font-size="11" fill="#cbd5e1">• A/B 테스트 · 점진적 배포 · 롤백</text>
</svg>

# 빌드 확인 (2026-10-06) — jekyll/builder:latest 이미지가 Ruby 3.4 · Jekyll 4.4 로 바뀌어
# Gemfile.lock(Jekyll 4.3.2) 의 gem 을 못 찾고 실패하던 것을, lock 그대로 설치하는 방식으로 바꾼다.
# (vcanus/vcanus.github.io 의 pages.yml 빌드 단계와 같다. 배포는 이 저장소의 Pages 설정이 맡는다.)
name: Jekyll site CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build --future
        env:
          JEKYLL_ENV: production
